name: Test CI/CD Logic

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  verify-failure-mode:
    name: Verify Tool Breaks Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Start Vulnerable Server (Background)
        # Starts the server in the background & gives it 5s to boot
        run: |
          go run tests/vulnerable_server.go &
          sleep 5

      - name: Run Kashef & Expect Exit Code 1
        run: |
          # 1. Run the tool.
          # 2. Capture the exit code.
          set +e
          
          go run cmd/kashef/main.go scan openapi examples/vulnerable_server.yaml --fail-on high
          EXIT_CODE=$?
          
          echo "Kashef exited with: $EXIT_CODE"

          # 4. Assert the logic
          if [ $EXIT_CODE -eq 1 ]; then
            echo "✅ SUCCESS: Kashef correctly identified issues and failed the build."
            exit 0
          else
            echo "❌ FAILURE: Kashef returned $EXIT_CODE but should have returned 1."
            echo "   This means the CI/CD integration is NOT working properly."
            exit 1
          fi
